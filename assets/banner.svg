<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Vinicius Pontes</title>
  <desc id="desc">Desenvolvedor Júnior · Oracle PL/SQL, ERP e Integrações</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask">
      <rect width="1200" height="260" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1200" height="260" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)" mask="url(#gridmask)"/>
    <circle cx="1090" cy="30" r="150" fill="#60a5fa" fill-opacity="0.10"/>
    <circle cx="1150" cy="240" r="95" fill="#93c5fd" fill-opacity="0.08"/>
  </g>
  <text x="80" y="126" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Vinicius Pontes</text>
  <text x="82" y="178" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Desenvolvedor Júnior · Oracle PL/SQL, ERP e Integrações</text>
  <rect x="82" y="202" width="64" height="4" rx="2" fill="#60a5fa"/>
</svg>
